# Options JVM du démon Gradle.
# 2 Go requis : le dexing (D8/R8) des dépendances Firebase (Cloud Messaging) dépasse 1 Go
# et provoque sinon un « OutOfMemoryError: Java heap space » au packaging de l'APK.
# Sur une machine très contrainte, ferme les autres applications avant le build.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# AndroidX obligatoire.
android.useAndroidX=true

# Kotlin officiel.
kotlin.code.style=official

# Cache activé (disque). Parallélisme DÉSACTIVÉ pour réduire la pression mémoire sur les
# machines contraintes (le projet est petit, l'impact sur la vitesse est négligeable).
org.gradle.parallel=false
org.gradle.caching=true

# Délais réseau généreux pour les connexions lentes/instables (évite « Read timed out »
# pendant le téléchargement des dépendances). Valeurs en millisecondes (180 s).
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
