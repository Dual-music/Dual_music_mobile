# Options JVM du démon Gradle. En stratégie Kotlin "in-process" (voir plus bas), le
# compilateur Kotlin tourne DANS ce process : on prévoit donc plus de mémoire.
# 2,5 Go : dexing (D8/R8) Firebase (Cloud Messaging) > 1 Go + compilation Kotlin dans le même JVM.
# Sur une machine très contrainte, ferme les autres applications avant le build.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=640m -Dfile.encoding=UTF-8

# Compilation Kotlin DANS le process Gradle (pas de démon Kotlin séparé). Cette machine
# échoue de façon répétée à démarrer/contacter le démon Kotlin ("daemon terminated on
# startup", puis "Could not connect to Kotlin compile daemon") : in-process supprime le
# démon et donc le problème. Un peu plus lent à froid, mais fiable.
kotlin.compiler.execution.strategy=in-process

# AndroidX obligatoire.
android.useAndroidX=true

# Kotlin officiel.
kotlin.code.style=official

# Cache activé (disque). Parallélisme DÉSACTIVÉ pour réduire la pression mémoire sur les
# machines contraintes (le projet est petit, l'impact sur la vitesse est négligeable).
org.gradle.parallel=false
org.gradle.caching=true

# Délais réseau généreux pour les connexions lentes/instables (évite « Read timed out »
# pendant le téléchargement des dépendances). Valeurs en millisecondes (180 s).
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
