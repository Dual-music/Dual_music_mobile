# CI iOS — Dual Music
#
# Rôle : compiler et tester l'app iOS **à chaque push/PR**, sur un runner macOS GitHub.
# C'est le filet de sécurité principal du projet : le développement se fait sous Windows,
# donc aucune erreur de compilation Swift n'est détectable localement. Tout ce qui casse
# doit être attrapé ici.
#
# Trois étages, du plus rapide au plus complet :
#   1. `lint`      — style (non bloquant, feedback immédiat) ;
#   2. `kit-tests` — tests unitaires du paquet DualMusicKit sur simulateur ;
#   3. `app-build` — génération du projet Xcode + build de l'app + tests UI.
name: iOS CI

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ci.yml'
  # Permet de relancer la CI à la demande depuis l'onglet Actions.
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Simulateur cible. `OS=latest` évite de casser à chaque montée de version d'Xcode.
  DESTINATION: 'platform=iOS Simulator,name=iPhone 15,OS=latest'

jobs:
  # ===========================================================================
  #  1. Qualité de forme
  # ===========================================================================
  lint:
    name: SwiftLint (non bloquant)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Installer SwiftLint
        run: brew install swiftlint

      # `--strict` n'est volontairement PAS utilisé : le style ne doit pas bloquer une
      # livraison. Les avertissements restent visibles dans l'annotation de la PR.
      - name: Analyser
        working-directory: ios
        run: swiftlint lint --reporter github-actions-logging || true

  # ===========================================================================
  #  2. Tests unitaires du paquet (domaine, réseau, design system)
  # ===========================================================================
  kit-tests:
    name: Tests DualMusicKit
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Sélectionner Xcode 15.4
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app

      - name: Cache des dépendances SwiftPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/Packages/DualMusicKit/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      # Le paquet cible iOS uniquement (SwiftUI/UIKit) : on le teste donc sur simulateur,
      # et non avec `swift test` qui compilerait pour macOS.
      # `-sdk iphonesimulator` en plus de `-destination` : sans lui, le schéma auto-généré
      # pour un paquet SPM multi-plateforme (macOS déclaré à cause de LiveKit, cf.
      # Package.swift) tente aussi de compiler tout le paquet pour macOS — et casse sur le
      # moindre code UIKit-only (CoreUI). `-sdk` fixe la plateforme de compilation elle-même,
      # là où `-destination` ne fait que choisir où EXÉCUTER les tests.
      #
      # ⚠️ NE PAS ajouter -derivedDataPath ici : testé une fois, ça déplace le checkout des
      # dépendances SwiftPM vers un chemin local qui entre en conflit avec la résolution de
      # paquet par défaut d'Xcode ("already open as a Swift User Managed Package Folder").
      # ⚠️ Flake connu d'xcodebuild 15.4 : combiner -sdk et -destination sur un schéma de
      # paquet SPM résout parfois BUILT_PRODUCTS_DIR de façon incohérente entre la phase de
      # build (Debug-iphonesimulator/, correct) et le lancement des bundles .xctest (Debug/,
      # absent → "Failed to create a bundle instance"). Reproductible ~1 run sur 2, sans
      # rapport avec le code (aucune erreur de compilation dans ce cas). On retente donc au
      # lieu de bloquer toute la CI sur un aléa de l'outillage Apple.
      - name: Tester le paquet sur simulateur
        working-directory: ios/Packages/DualMusicKit
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "::group::Tentative $attempt/3"
            if xcodebuild test \
              -scheme DualMusicKit \
              -sdk iphonesimulator \
              -destination "$DESTINATION" \
              -resultBundlePath TestResults.xcresult \
              CODE_SIGNING_ALLOWED=NO; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Tentative $attempt échouée."
            rm -rf TestResults.xcresult
          done
          exit 1

      - name: Publier les résultats de test
        if: always()
        continue-on-error: true # quota de stockage Actions atteint ≠ échec des tests eux-mêmes
        uses: actions/upload-artifact@v4
        with:
          name: kit-test-results
          path: ios/Packages/DualMusicKit/TestResults.xcresult
          if-no-files-found: ignore

  # ===========================================================================
  #  3. Build de l'application + tests UI
  # ===========================================================================
  app-build:
    name: Build app + tests UI
    runs-on: macos-14
    # TEMP (à restaurer : needs: kit-tests) — en parallèle le temps de stabiliser ce job,
    # pour ne pas attendre ~10 min de kit-tests à chaque itération.
    env:
      # Le runtime iOS "latest" d'Xcode 16.2 (18.2) n'a pas de simulateur "iPhone 15" par
      # défaut (seulement iPhone 16/SE) — le DESTINATION global (Xcode 15.4, runtime 17.x)
      # ne s'applique pas ici.
      DESTINATION: 'platform=iOS Simulator,name=iPhone 16,OS=latest'
    steps:
      - uses: actions/checkout@v4

      # Xcode 16.2 ici (pas 15.4 comme le job précédent) : `brew install xcodegen`
      # installe la dernière version, qui génère un .xcodeproj au format 77
      # (objectVersion), introduit par Xcode 16 — illisible par Xcode 15.4
      # ("future Xcode project file format"). Le runner GitHub fournit les deux.
      - name: Sélectionner Xcode 16.2
        run: sudo xcode-select -switch /Applications/Xcode_16.2.app

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Cache des dépendances SwiftPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/Packages/DualMusicKit/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      # Le .xcodeproj n'est pas committé : on le régénère depuis project.yml.
      - name: Générer le projet Xcode
        working-directory: ios
        run: xcodegen generate

      # `CODE_SIGNING_ALLOWED=NO` : aucun certificat n'est nécessaire pour un build
      # simulateur, ce qui garde la CI utilisable sans secret Apple.
      - name: Compiler l'app (simulateur)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project DualMusic.xcodeproj \
            -scheme DualMusic \
            -destination "$DESTINATION" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      # `-skip-testing:…testLaunchPerformance` : les tests de performance de lancement
      # (`measure(metrics: [XCTApplicationLaunchMetric()])`, plusieurs cycles launch/kill)
      # ont besoin d'une machine dédiée et stable pour produire une mesure fiable — sur un
      # runner CI partagé/mutualisé, ils sont connus pour planter ou traîner sporadiquement
      # sans rapport avec une régression réelle de l'app. À exécuter en local sur un Mac
      # dédié si le suivi de régression de démarrage est nécessaire.
      #
      # Reprise automatique (même logique que kit-tests) : le lancement d'app en simulateur
      # CI reste occasionnellement instable (charge du runner partagé) indépendamment du
      # code de l'app.
      - name: Tests UI (lancement, écran de connexion)
        working-directory: ios
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "::group::Tentative $attempt/3"
            if xcodebuild test \
              -project DualMusic.xcodeproj \
              -scheme DualMusic \
              -destination "$DESTINATION" \
              -derivedDataPath DerivedData \
              -only-testing:DualMusicUITests \
              -skip-testing:DualMusicUITests/LaunchUITests/testLaunchPerformance \
              -resultBundlePath UITestResults.xcresult \
              CODE_SIGNING_ALLOWED=NO; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Tentative $attempt échouée."
            rm -rf UITestResults.xcresult
          done
          exit 1

      - name: Publier les résultats des tests UI
        if: always()
        continue-on-error: true # quota de stockage Actions atteint ≠ échec des tests eux-mêmes
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: ios/UITestResults.xcresult
          if-no-files-found: ignore
