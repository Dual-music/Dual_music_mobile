# CI Android — Dual Music
#
# Compile l'app à chaque push/PR sur `main`. But : attraper automatiquement les erreurs
# de compilation (plus besoin de build manuel local).
#
# Notes :
#  - Le module KMM `shared-domain` vit HORS de `android/` (mono-repo) et est mappé par
#    settings.gradle.kts (`../shared-domain`). Le checkout récupère tout le dépôt, donc la
#    référence relative fonctionne. Ses cibles iOS sont déclarées macOS-only → le build
#    Android sous Linux ne compile que la cible Android/JVM.
#  - Pas de gradle-wrapper.jar committé (Android Studio utilise son propre Gradle) : on
#    installe Gradle 8.13 via `gradle/actions/setup-gradle` et on invoque `gradle` direct.
name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annule les runs obsolètes sur une même branche.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & tests (debug)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # Tests unitaires (JVM) des modules qui en ont (shared-domain, core:network, …).
      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      # Compile + assemble l'APK debug (valide TOUT le code de tous les modules).
      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dual-music-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
