# =============================================================================
#  Dual Music — définition du projet Xcode (XcodeGen)
# =============================================================================
#  Le `.xcodeproj` n'est PAS committé : il est **généré** à partir de ce fichier.
#  Bénéfices concrets pour ce dépôt :
#    - aucun conflit Git sur le `project.pbxproj` (fichier binaire-ish illisible) ;
#    - la configuration est relisible et diffable comme du code ;
#    - un poste neuf obtient un projet identique en une commande.
#
#  Générer / régénérer :
#      brew install xcodegen        # une fois
#      cd ios && xcodegen generate  # crée DualMusic.xcodeproj
#      open DualMusic.xcodeproj
#
#  ⚠️ Avant le premier build sur un vrai appareil, renseigner `DEVELOPMENT_TEAM`
#     (identifiant d'équipe Apple Developer, 10 caractères) dans la section `settings`.
# =============================================================================

name: DualMusic
options:
  bundleIdPrefix: com.dualmusic
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top

# --- Paquets Swift ----------------------------------------------------------
packages:
  # Tout le code métier + UI de l'app (modules Core* et Feature*).
  DualMusicKit:
    path: Packages/DualMusicKit
  # Push : le backend envoie via FCM, l'app doit donc fournir un jeton FCM.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "10.24.0"
  # Connexion Google native (échange d'ID token avec le backend).
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.1.0"

# --- Réglages communs -------------------------------------------------------
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    # ⚠️ À RENSEIGNER : identifiant de l'équipe Apple Developer (ex. ABCDE12345).
    # Laisser vide fonctionne pour le simulateur ; un appareil physique l'exige.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  # ===========================================================================
  #  Application
  # ===========================================================================
  DualMusic:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - package: DualMusicKit
        product: DualMusicKit
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: App/Resources/Info.plist
    entitlements:
      path: App/Resources/DualMusic.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dualmusic.app
        PRODUCT_NAME: DualMusic
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Resources/DualMusic.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        # Placeholders Google : renseigner après création du client OAuth iOS.
        # `DM_GOOGLE_REVERSED_CLIENT_ID` = l'ID client à l'envers, SANS le préfixe
        # `com.googleusercontent.apps.` inclus — ex. com.googleusercontent.apps.123-abc
        DM_GOOGLE_CLIENT_ID: ""
        DM_GOOGLE_REVERSED_CLIENT_ID: ""
      configs:
        Debug:
          # Simulateur : `localhost` fonctionne.
          # iPhone physique : remplacer par l'IP locale du poste qui héberge le backend,
          # ex. http://192.168.1.20:4000 (même Wi-Fi, backend démarré).
          DM_API_BASE_URL: http://localhost:4000
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          DM_API_BASE_URL: https://api.dualmusic.app
          SWIFT_COMPILATION_MODE: wholemodule

  # ===========================================================================
  #  Tests unitaires de l'app (la logique métier est testée dans le paquet Swift)
  # ===========================================================================
  DualMusicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/Tests
    dependencies:
      - target: DualMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dualmusic.app.tests
        GENERATE_INFOPLIST_FILE: YES

  # ===========================================================================
  #  Tests d'interface (parcours critiques : connexion, navigation, portefeuille)
  # ===========================================================================
  DualMusicUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/UITests
    dependencies:
      - target: DualMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dualmusic.app.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DualMusic:
    build:
      targets:
        DualMusic: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - DualMusicTests
        - DualMusicUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
